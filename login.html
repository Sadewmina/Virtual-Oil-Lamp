<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="author" content="Sadewmina Prabashwara" />
    <meta name="application-name" content="Virtual Oil Lamp" />
    <meta name="version" content="1.0" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Virtual Oil Lamp v1.0 · Dewlabs — Sign in</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="login-screen">
    <main class="login-card">
      <div class="login-mark"><span class="login-mark-fallback">✦</span><img class="login-mark-image" alt="" hidden></div>
      <div class="eyebrow">VIRTUAL OIL LAMP</div>
      <small class="brand-signature">DEWLABS · v1.0</small>
      <h1 id="formTitle">Sign in</h1>
      <p id="formIntro">Use your account to open the page assigned to you.</p>
      <form id="loginForm">
        <label for="username">Account name</label
        ><input id="username" autocomplete="username" minlength="3" maxlength="32" required /><label
          for="password"
          >Password</label
        ><input
          id="password"
          type="password"
          autocomplete="current-password"
          minlength="8"
          required
        /><label for="deviceName">Device name</label
        ><input id="deviceName" maxlength="48" required /><button
          class="primary"
          id="submitButton"
          type="submit"
        >
          Sign in
        </button>
      </form>
      <div class="login-error" id="loginError" role="alert"></div>
      <button class="mode-switch" id="modeSwitch" type="button">Create a new account</button>
      <p class="default-login" id="defaultLogin">
        First administrator login: <b>admin</b> / <b>LampAdmin123!</b>
      </p>
    </main>
    <script src="brand.js"></script>
    <script src="login.js"></script>
  </body>
</html>
